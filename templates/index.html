<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepfake Detection</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background-image: url('/static/video.mp4')">

    <div class="container">
        <h1 class="mt-5 text-center text-white">Deepfake Detection</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <a href="/upload" class="btn btn-primary mt-4 d-block mx-auto">Get Started</a>
            </div>
        </div>
    </div>
    <!-- result.html -->
<h2>Prediction: {{ detection_result }}</h2>
<h3>Accuracy: {{ accuracy }}%</h3>

<form action="/feedback" method="POST">
    <label>Was the prediction correct?</label><br>
    <input type="radio" id="yes" name="feedback" value="correct">
    <label for="yes">Yes</label><br>
    <input type="radio" id="no" name="feedback" value="incorrect">
    <label for="no">No</label><br>
    <button type="submit">Submit Feedback</button>
</form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
